name: Tests

on:
  push:
    branches: [main, 1.x]
  pull_request:
    branches: [main, 1.x]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 11
          - php: 8.2
            laravel: 11
            testbench: 9
          - php: 8.3
            laravel: 11
            testbench: 9
          - php: 8.4
            laravel: 11
            testbench: 9
          # Laravel 12
          - php: 8.2
            laravel: 12
            testbench: 10
          - php: 8.3
            laravel: 12
            testbench: 10
          - php: 8.4
            laravel: 12
            testbench: 10
          # Laravel 13 (requires PHP 8.3+)
          - php: 8.3
            laravel: 13
            testbench: 11
          - php: 8.4
            laravel: 13
            testbench: 11

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/database:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: ./vendor/bin/phpunit
